[project]
name = "rl-missile-sim"
version = "0.1.0"
description = "Planar missile-target engagement simulator and Gymnasium environment"
readme = "README.md"
authors = [
    { name = "Jean-Elie Pierre", email = "gno320@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pygame>=2.6.1",
    "scipy>=1.17.1",
    "stable-baselines3[extra]>=2.9.0",
    "torch==2.9.0",
]

[project.optional-dependencies]
train = ["stable-baselines3>=2.5", "tensorboard"]
render = ["pygame"]

[project.scripts]
rl-missile-sim-eval = "rl_missile_sim.eval_train:main"
rl-missile-sim-render = "rl_missile_sim.render_demo:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
